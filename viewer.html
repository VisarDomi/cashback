<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs — Cashback Platform</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #2a2a3a;
    --text: #e0e0ec;
    --text-dim: #8888a0;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --blue: #3b82f6;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Navbar */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    height: 52px;
    gap: 8px;
    overflow-x: auto;
  }

  nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    white-space: nowrap;
    transition: all 0.15s;
  }

  nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  nav a.active { color: var(--accent-light); background: rgba(99,102,241,0.12); }

  nav .brand {
    font-weight: 700;
    font-size: 14px;
    color: var(--accent-light);
    margin-right: 16px;
    padding: 0;
  }

  nav .brand:hover { background: none; color: var(--accent-light); }

  nav .divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 8px;
    flex-shrink: 0;
  }

  /* Content */
  .content {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 32px 120px;
  }

  /* Markdown styles */
  .markdown h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    margin: 48px 0 16px;
    color: #f0f0fa;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .markdown h1:first-child { margin-top: 0; }

  .markdown h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 40px 0 12px;
    color: #e0e0f0;
  }

  .markdown h3 {
    font-size: 19px;
    font-weight: 600;
    margin: 28px 0 8px;
    color: var(--accent-light);
  }

  .markdown h4 {
    font-size: 16px;
    font-weight: 600;
    margin: 24px 0 8px;
    color: var(--text);
  }

  .markdown p {
    font-size: 16px;
    line-height: 1.75;
    margin: 12px 0;
    color: var(--text);
  }

  .markdown ul, .markdown ol {
    margin: 12px 0;
    padding-left: 24px;
  }

  .markdown li {
    font-size: 16px;
    line-height: 1.7;
    margin: 6px 0;
    color: var(--text);
  }

  .markdown li::marker { color: var(--accent); }

  .markdown strong { color: #f0f0fa; font-weight: 600; }

  .markdown a {
    color: var(--accent-light);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .markdown a:hover { border-bottom-color: var(--accent-light); }

  .markdown code {
    font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    font-size: 14px;
    background: rgba(255,255,255,0.06);
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--accent-light);
  }

  .markdown pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin: 16px 0;
    overflow-x: auto;
  }

  .markdown pre code {
    background: none;
    padding: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-dim);
  }

  .markdown blockquote {
    border-left: 3px solid var(--accent);
    padding: 8px 20px;
    margin: 16px 0;
    background: rgba(99,102,241,0.05);
    border-radius: 0 8px 8px 0;
  }

  .markdown blockquote p { color: var(--text-dim); }

  .markdown hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }

  .markdown table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 15px;
  }

  .markdown th {
    text-align: left;
    padding: 10px 14px;
    background: var(--surface);
    color: var(--accent-light);
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 2px solid var(--border);
  }

  .markdown td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .markdown tr:last-child td { border-bottom: none; }

  .markdown img { max-width: 100%; border-radius: 8px; }

  /* Loading state */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--text-dim);
    font-size: 15px;
  }

  .error {
    color: var(--red);
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    padding: 20px;
    border-radius: 8px;
    margin-top: 32px;
  }

  /* File list (shown when no file param) */
  .file-list {
    list-style: none;
    padding: 0;
    margin-top: 24px;
  }

  .file-list li {
    margin: 0;
    border-bottom: 1px solid var(--border);
  }

  .file-list li:last-child { border-bottom: none; }

  .file-list a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 16px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s;
    border-radius: 8px;
  }

  .file-list a:hover { background: rgba(255,255,255,0.04); }

  .file-list .file-icon {
    font-size: 20px;
    width: 40px;
    height: 40px;
    background: rgba(99,102,241,0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-list .file-name {
    font-weight: 600;
    font-size: 15px;
  }

  .file-list .file-path {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
</style>
</head>
<body>

<nav id="navbar">
  <a href="/" class="brand">cashback</a>
  <div class="divider"></div>
  <a href="/">Slideshow</a>
  <a href="/condense.md">Brainstorm</a>
  <a href="/platform-research.md">Research</a>
  <a href="/feedback.md">Feedback</a>
  <a href="/temp.md">Notes</a>
</nav>

<div class="content">
  <div id="output" class="markdown">
    <div class="loading">Loading...</div>
  </div>
</div>

<script>
  // Extract filename from path: /condense.md → condense.md
  const pathMatch = window.location.pathname.match(/^\/([a-zA-Z0-9_-]+\.md)$/);
  const file = pathMatch ? pathMatch[1] : null;
  const output = document.getElementById('output');

  // Highlight active nav link
  document.querySelectorAll('#navbar a').forEach(a => {
    const linkPath = new URL(a.href).pathname;
    if (linkPath === window.location.pathname) {
      a.classList.add('active');
    }
  });

  if (!file) {
    // Show file index
    const docs = [
      { name: 'Brainstorm Condensed', file: 'condense.md', desc: 'Full strategy, models, roadmap, and next steps' },
      { name: 'Platform Research', file: 'platform-research.md', desc: 'Deep research on Ibotta, Fetch, Stocard, Payback, Shopkick, Nectar' },
      { name: 'Feedback Notes', file: 'feedback.md', desc: 'Discussion notes and feedback' },
      { name: 'Temp Notes', file: 'temp.md', desc: 'Temporary notes and scratch' },
    ];

    output.innerHTML = `
      <h1>Documentation</h1>
      <p style="color: var(--text-dim); margin-bottom: 8px;">All project documents. Click to read.</p>
      <ul class="file-list">
        ${docs.map(d => `
          <li>
            <a href="/${d.file}">
              <div class="file-icon">&#128196;</div>
              <div>
                <div class="file-name">${d.name}</div>
                <div class="file-path">/${d.file} &mdash; ${d.desc}</div>
              </div>
            </a>
          </li>
        `).join('')}
      </ul>
    `;
  } else {
    fetch(`/docs/${file}`)
      .then(r => {
        if (!r.ok) throw new Error(`File not found: ${file}`);
        return r.text();
      })
      .then(md => {
        output.innerHTML = marked.parse(md);
        document.title = file.replace('.md', '') + ' — Cashback Platform';
      })
      .catch(err => {
        output.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
      });
  }
</script>

</body>
</html>
